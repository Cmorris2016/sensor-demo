<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn to Code: Drum Machine</title>
  <style>
    /* --- CSS: Styling the Drum Machine ---
      This section makes it look good. We use Flexbox to center everything 
      and CSS transitions to make the keys "pop" when pressed.
    */
    
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #282c34; /* Dark background */
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      margin-bottom: 50px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .keys {
      display: flex;
      gap: 15px; /* Space between keys */
      flex-wrap: wrap;
      justify-content: center;
      max-width: 900px;
    }

    .key {
      border: 4px solid #444;
      border-radius: 10px;
      margin: 10px;
      font-size: 1.5rem;
      padding: 20px 15px;
      transition: all 0.07s ease; /* Smoothly animate changes */
      width: 80px;
      text-align: center;
      background: rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }

    /* This class is added by JavaScript when a key is pressed. 
      It changes the border color and scales the key up slightly.
    */
    .key.playing {
      transform: scale(1.1);
      border-color: #61dafb; /* React blue color for highlighting */
      box-shadow: 0 0 15px #61dafb;
    }

    kbd {
      display: block;
      font-size: 2.5rem;
      font-weight: bold;
    }

    .sound {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #61dafb;
      margin-top: 10px;
      display: block;
    }
  </style>
</head>
<body>

  <h1>JavaScript Drum Machine</h1>

  <div class="keys">
    <div data-key="65" class="key">
      <kbd>A</kbd>
      <span class="sound">clap</span>
    </div>
    <div data-key="83" class="key">
      <kbd>S</kbd>
      <span class="sound">hihat</span>
    </div>
    <div data-key="68" class="key">
      <kbd>D</kbd>
      <span class="sound">kick</span>
    </div>
    <div data-key="70" class="key">
      <kbd>F</kbd>
      <span class="sound">openhat</span>
    </div>
    <div data-key="71" class="key">
      <kbd>G</kbd>
      <span class="sound">boom</span>
    </div>
    <div data-key="72" class="key">
      <kbd>H</kbd>
      <span class="sound">ride</span>
    </div>
    <div data-key="74" class="key">
      <kbd>J</kbd>
      <span class="sound">snare</span>
    </div>
    <div data-key="75" class="key">
      <kbd>K</kbd>
      <span class="sound">tom</span>
    </div>
    <div data-key="76" class="key">
      <kbd>L</kbd>
      <span class="sound">tink</span>
    </div>
  </div>

  <audio data-key="65" src="https://raw.githubusercontent.com/wesbos/JavaScript30/master/01%20-%20JavaScript%20Drum%20Kit/sounds/clap.wav"></audio>
  <audio data-key="83" src="https://raw.githubusercontent.com/wesbos/JavaScript30/master/01%20-%20JavaScript%20Drum%20Kit/sounds/hihat.wav"></audio>
  <audio data-key="68" src="https://raw.githubusercontent.com/wesbos/JavaScript30/master/01%20-%20JavaScript%20Drum%20Kit/sounds/kick.wav"></audio>
  <audio data-key="70" src="https://raw.githubusercontent.com/wesbos/JavaScript30/master/01%20-%20JavaScript%20Drum%20Kit/sounds/openhat.wav"></audio>
  <audio data-key="71" src="https://raw.githubusercontent.com/wesbos/JavaScript30/master/01%20-%20JavaScript%20Drum%20Kit/sounds/boom.wav"></audio>
  <audio data-key="72" src="https://raw.githubusercontent.com/wesbos/JavaScript30/master/01%20-%20JavaScript%20Drum%20Kit/sounds/ride.wav"></audio>
  <audio data-key="74" src="https://raw.githubusercontent.com/wesbos/JavaScript30/master/01%20-%20JavaScript%20Drum%20Kit/sounds/snare.wav"></audio>
  <audio data-key="75" src="https://raw.githubusercontent.com/wesbos/JavaScript30/master/01%20-%20JavaScript%20Drum%20Kit/sounds/tom.wav"></audio>
  <audio data-key="76" src="https://raw.githubusercontent.com/wesbos/JavaScript30/master/01%20-%20JavaScript%20Drum%20Kit/sounds/tink.wav"></audio>

  <script>
    // Function 1: Play the sound and add the animation class
    function playSound(event) {
      // Determine the key code. Support both keyboard presses and mouse clicks.
      // If it's a keyboard event, grab event.keyCode. If mouse click, grab a custom dataset value we'll pass.
      const keyCode = event.keyCode || this.dataset.key;

      // Find the specific audio element and visual key div using the keyCode
      const audio = document.querySelector(`audio[data-key="${keyCode}"]`);
      const key = document.querySelector(`.key[data-key="${keyCode}"]`);

      // If there is no audio element for this key, stop the function from running
      if (!audio) return;

      // Rewind the audio to the start so you can hit it rapidly
      audio.currentTime = 0; 
      
      // Play the audio
      audio.play();

      // Add the 'playing' class to the visual key so it lights up (CSS handles the look)
      key.classList.add('playing');
    }

    // Function 2: Remove the animation class once the CSS transition finishes
    function removeTransition(event) {
      // Skip if it's not a transform event (we only care about the scale transform ending)
      if (event.propertyName !== 'transform') return;
      
      // 'this' refers to the key div that triggered this event. Remove the class.
      this.classList.remove('playing');
    }

    // --- Setting up Event Listeners ---

    // 1. Listen for the end of the CSS animation to revert the keys back to normal
    const keys = document.querySelectorAll('.key'); // Grab all elements with class "key"
    keys.forEach(key => key.addEventListener('transitionend', removeTransition));

    // 2. Listen for Keyboard presses
    window.addEventListener('keydown', playSound);

    // 3. Listen for Mouse clicks on the buttons (bonus feature!)
    keys.forEach(key => key.addEventListener('click', playSound));

  </script>
</body>
</html>
